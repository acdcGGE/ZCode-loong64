packages:
  - apps/dev-docs
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
    - loong64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
  # loong64: 上游没有预编译产物，允许从源码构建
  "@napi-rs/canvas": true
  "@napi-rs/keyring": true
  "@tailwindcss/oxide": true
  "@mbears/opentui-core": true
  lightningcss: true
  sharp: true
